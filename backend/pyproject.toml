[project]
name = "oncoflow-backend"
version = "0.1.0"
description = "API do OncoFlow: coordenação da jornada oncológica"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pyjwt==2.15.1",
  "bcrypt==5.0.0",
  "tzdata==2026.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

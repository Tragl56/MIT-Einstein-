services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oncoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-oncoflow}
    ports:
      - "5432:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
      - ./backend/scripts/criar_banco_teste.sql:/docker-entrypoint-initdb.d/01_banco_teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncoflow} -d ${POSTGRES_DB:-oncoflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oncoflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oncoflow}
      CORS_ORIGENS: '["http://localhost:5173","http://localhost:5174"]'
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Um serviço só para os dois apps: evita dois `npm ci` concorrentes no mesmo volume de node_modules
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_ALVO: http://backend:8000
    command: >
      sh -c "npm ci &&
             (npm run dev:pro -- --host 0.0.0.0 & npm run dev:paciente -- --host 0.0.0.0 & wait)"
    ports:
      - "5173:5173"   # OncoFlow Pro
      - "5174:5174"   # OncoFlow Paciente
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  dados_db:
  node_modules:
